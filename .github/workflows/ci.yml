name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: cspm }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node lib/db/gen-schema.mjs && git diff --exit-code lib/db/src/migrations.generated.ts replica/schema.sql
      - run: pnpm audit --prod
      - run: pnpm -r --filter "./artifacts/**" --filter @workspace/cspm-engine --if-present run typecheck
      - run: pnpm --filter @workspace/cspm-engine test
      - run: pnpm --filter @workspace/db test
        env: { TEST_DATABASE_URL: "postgres://postgres:ci@localhost:5432/cspm" }
      - run: pnpm --filter @workspace/api-server test            # embedded Postgres
      - run: pnpm --filter @workspace/api-server test            # real Postgres
        env: { TEST_DATABASE_URL: "postgres://postgres:ci@localhost:5432/cspm" }
      - run: pnpm --filter @workspace/cspm-site build && pnpm --filter @workspace/cspm-app build && pnpm --filter @workspace/api-server build
        env: { VITE_APP_URL: "https://app.cspm.example.test", VITE_API_URL: "https://api.cspm.example.test" }
      - run: npx playwright test
        working-directory: e2e
